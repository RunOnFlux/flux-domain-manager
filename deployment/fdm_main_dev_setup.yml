---
- name: Install and configure FDM
  hosts: "main_dev_fdm_servers"
  become: yes

  tasks:
    - name: Update apt package list
      ansible.builtin.apt:
        update_cache: yes

    - name: Install required packages
      ansible.builtin.package:
        name:
          - software-properties-common
          - certbot
          - haproxy
          - dirmngr
          - gnupg
          - apt-transport-https
          - ca-certificates
          - build-essential
          - libssl-dev
          - curl
          - python3-pip
          - socat
        state: present

    - name: Download and run NodeSource setup script
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
      args:
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: Install Node.js 22.x
      ansible.builtin.package:
        name: nodejs
        state: present

    - name: Install PM2 globally using NPM
      command: npm install -g pm2

    # Without this pm2 never rotates anything and the out logs grow without bound: the dev
    # director reached 5.1GB, one file at 3.9GB, over about a year. The settings were
    # already present in ~/.pm2/module_conf.json on the boxes — the module they configure
    # had simply never been installed, so nothing acted on them.
    #
    # Keyed on the module directory rather than on `pm2 list` output: pm2 installs modules
    # to ~/.pm2/modules/<name>, which is a fact about pm2 rather than about how its table
    # happens to be formatted.
    - name: Check whether pm2-logrotate is installed
      ansible.builtin.stat:
        path: /root/.pm2/modules/pm2-logrotate
      register: pm2_logrotate_module

    - name: Install pm2-logrotate
      command: pm2 install pm2-logrotate
      when: not pm2_logrotate_module.stat.exists

    - name: Read the current pm2 module config
      ansible.builtin.slurp:
        src: /root/.pm2/module_conf.json
      register: pm2_module_conf
      failed_when: false

    # `pm2 set` restarts the module, so only the settings that actually differ are applied
    # and a converged box reports no change.
    - name: Configure pm2-logrotate
      command: "pm2 set pm2-logrotate:{{ item.key }} {{ item.value }}"
      loop:
        - { key: 'max_size', value: '100M' }
        - { key: 'retain', value: '10' }
        - { key: 'compress', value: 'true' }
      loop_control:
        label: "{{ item.key }}={{ item.value }}"
      when: pm2_logrotate_settings[item.key] | default('', true) | string != item.value
      vars:
        pm2_logrotate_settings: "{{ (pm2_module_conf.content | b64decode | from_json).get('pm2-logrotate', {}) if pm2_module_conf.content is defined else {} }}"

    - name: Ensure directory exists
      ansible.builtin.file:
        path: /etc/ssl/fluxapps
        owner: root
        group: root
        state: directory
        mode: '0755'

    - name: Get dhparam
      ansible.builtin.get_url:
        url: https://ssl-config.mozilla.org/ffdhe4096.txt
        dest: /etc/haproxy/dhparam
        mode: '0644'

    - name: Reset config file to HEAD before git operations
      shell: git checkout HEAD -- config/default.js
      args:
        chdir: flux-domain-manager
      ignore_errors: yes

    - name: Clone FDM
      ansible.builtin.git:
        repo: https://github.com/RunOnFlux/flux-domain-manager.git
        dest: flux-domain-manager
        version: main
        force: yes
        update: yes
        clone: yes
        depth: 1
        accept_hostkey: yes

    - name: Copy default.js config to FDM
      ansible.builtin.template:
        src: default.js.j2
        dest: flux-domain-manager/config/default.js
        mode: '0644'
      vars:
        appSubDomain: "app2"
        useSubset: "false"
        manageApps: "false"
        fdmAppDomain: "fdm-lb-2-1.runonflux.io"
        startSubset: "0"
        endSubset: "F"
        uiName: "devhome"
        cloudUiName: "devcloud"
        apiName: "devapi"

    - name: Ensure config files exist (they should already be there from git clone)
      ansible.builtin.file:
        path: "flux-domain-manager/config/{{ item }}"
        state: file
      loop:
        - appsConfig.js
        - customConfigs.json
        - haproxyRouting.json
        - specDecrypt.json
        - domainOverrides.json
        - sharedDbRouting.json
        - appChecks.json
        - staticLocations.json

    - name: Install Dependencies FDM
      command: npm install
      args:
        chdir: flux-domain-manager

    - name: Start FDM with PM2
      shell: |
        if pm2 describe FDM > /dev/null 2>&1; then
          pm2 restart FDM --update-env
        else
          pm2 start index.js --name FDM
        fi
      args:
        chdir: flux-domain-manager
      environment:
        NODE_ENV: production
        NODE_CONFIG_DIR: /root/flux-domain-manager/config

