---
- name: Install and configure FDM
  hosts: "{{ 'app2_fdm_servers' if DEPLOY_ENV == 'staging' else 'app_fdm_servers' }}"
  become: yes

  tasks:
    - name: Set certRenewalPrimary flag
      set_fact:
        certRenewalPrimary: "{{ 'true' if 'fn' in inventory_hostname else 'false' }}"

    - name: Import MongoDB public GPG key
      ansible.builtin.get_url:
        url: "https://www.mongodb.org/static/pgp/server-6.0.asc"
        dest: /etc/apt/keyrings/mongo.asc
        mode: '0644'
        force: true

    - name: Add MongoDB repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/mongo.asc] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/6.0 multiverse"
        state: present
        filename: mongodb-org-6.0

    - name: Update apt package list
      ansible.builtin.apt:
        update_cache: yes

    - name: Install required packages
      ansible.builtin.package:
        name:
          - software-properties-common
          - certbot
          - haproxy
          - dirmngr
          - gnupg
          - apt-transport-https
          - ca-certificates
          - mongodb-org
          - build-essential
          - libssl-dev
          - curl
          - python3-pip
          - socat
        state: present

    - name: Install jc via python
      ansible.builtin.pip:
        name: jc
        version: 1.25.2
        break_system_packages: true

    - name: Install Node.js 22.x repository
      shell: "curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -"

    - name: Install Node.js
      apt:
        name: nodejs
        state: latest
        update_cache: yes

    - name: Install PM2 globally using NPM
      command: npm install -g pm2

    # Without this pm2 never rotates anything and the out logs grow without bound: the dev
    # director reached 5.1GB, one file at 3.9GB, over about a year. The settings were
    # already present in ~/.pm2/module_conf.json on the boxes — the module they configure
    # had simply never been installed, so nothing acted on them.
    - name: Install pm2-logrotate
      shell: pm2 list | grep -q pm2-logrotate || pm2 install pm2-logrotate

    - name: Configure pm2-logrotate
      command: "pm2 set pm2-logrotate:{{ item.key }} {{ item.value }}"
      loop:
        - { key: 'max_size', value: '100M' }
        - { key: 'retain', value: '10' }
        - { key: 'compress', value: 'true' }
      loop_control:
        label: "{{ item.key }}={{ item.value }}"

    - name: Enable and start MongoDB service
      ansible.builtin.systemd:
        name: mongod
        state: started
        enabled: yes

    - name: Ensure directory exists
      ansible.builtin.file:
        path: /etc/ssl/fluxapps
        owner: root
        group: root
        state: directory
        mode: '0755'

    - name: Disable certbot.timer (renewal handled by CDM)
      ansible.builtin.systemd:
        name: certbot.timer
        state: stopped
        enabled: no
      ignore_errors: yes

    - name: Remove old certbot cron
      ansible.builtin.file:
        path: /etc/cron.d/certbot
        state: absent

    - name: Copy Minecraft LUA file
      ansible.builtin.copy:
        src: haproxy_minecraft.lua
        dest: /etc/haproxy/haproxy_minecraft.lua
        owner: root
        group: root
        mode: '0644'
    
    - name: Get dhparam
      ansible.builtin.get_url:
        url: https://ssl-config.mozilla.org/ffdhe4096.txt
        dest: /etc/haproxy/dhparam
        mode: '0644'

    - name: Reset config file to HEAD before git operations (FDM)
      shell: git checkout HEAD -- config/default.js
      args:
        chdir: flux-domain-manager
      ignore_errors: yes

    - name: Reset config file to HEAD before git operations (CDM)
      shell: git checkout HEAD -- config/default.js
      args:
        chdir: cert-domain-manager
      when: certRenewalPrimary | bool
      ignore_errors: yes

    - name: Clone FDM
      ansible.builtin.git:
        repo: https://github.com/RunOnFlux/flux-domain-manager.git
        dest: flux-domain-manager
        version: "{{ GIT_BRANCH | default('main') }}"
        force: yes
        update: yes
        clone: yes
        depth: 1
        accept_hostkey: yes

    - name: Clone FDM as CDM
      ansible.builtin.git:
        repo: https://github.com/RunOnFlux/flux-domain-manager.git
        dest: cert-domain-manager
        version: "{{ GIT_BRANCH | default('main') }}"
        update: yes
        force: yes
        clone: yes
        depth: 1
        accept_hostkey: yes
      when: certRenewalPrimary | bool

    - name: Copy default.js config to FDM
      ansible.builtin.template:
        src: default.js.j2
        dest: flux-domain-manager/config/default.js
        mode: '0644'
      vars:
        certRenewalPrimary: "{{ certRenewalPrimary }}"
        appSubDomain: "{{ 'app2' if DEPLOY_ENV == 'staging' else 'app' }}"
        useSubset: "true"
        manageApps: "true"
        uiName: "home"
        cloudUiName: "cloud"
        apiName: "api"

    - name: Copy default.js config to CDM
      ansible.builtin.template:
        src: default.js.j2
        dest: cert-domain-manager/config/default.js
        mode: '0644'
      when: certRenewalPrimary | bool
      vars:
        certRenewalPrimary: "{{ certRenewalPrimary }}"
        appSubDomain: "{{ 'app2' if DEPLOY_ENV == 'staging' else 'app' }}"
        useSubset: "true"
        manageApps: "true"
        uiName: "home"
        cloudUiName: "cloud"
        apiName: "api"

    - name: Ensure config files exist for FDM (they should already be there from git clone)
      ansible.builtin.file:
        path: "flux-domain-manager/config/{{ item }}"
        state: file
      loop:
        - appsConfig.js
        - customConfigs.json
        - haproxyRouting.json
        - specDecrypt.json
        - domainOverrides.json
        - sharedDbRouting.json
        - appChecks.json
        - staticLocations.json

    - name: Ensure config files exist for CDM (they should already be there from git clone)
      ansible.builtin.file:
        path: "cert-domain-manager/config/{{ item }}"
        state: file
      when: certRenewalPrimary | bool
      loop:
        - appsConfig.js
        - customConfigs.json
        - haproxyRouting.json
        - specDecrypt.json
        - domainOverrides.json
        - sharedDbRouting.json
        - appChecks.json
        - staticLocations.json

    - name: Install Dependencies FDM
      command: npm install
      args:
        chdir: flux-domain-manager

    - name: Install Dependencies CDM
      command: npm install
      args:
        chdir: cert-domain-manager
      when: certRenewalPrimary | bool

    - name: Create Static Rsync Json File
      set_fact:
        static_json:
          type: "{{ 'app2_fdm_servers' if DEPLOY_ENV == 'staging' else 'app_fdm_servers' }}"
          host: "{{ inventory_hostname }}"

    - name: Write the static JSON to a file (CDM)
      ansible.builtin.copy:
        content: "{{ static_json | to_nice_json }}"
        dest: cert-domain-manager/deployment/rsync_config.json
        force: yes
      when: certRenewalPrimary | bool

    - name: Write the static JSON to a file (FDM)
      ansible.builtin.copy:
        content: "{{ static_json | to_nice_json }}"
        dest: flux-domain-manager/deployment/rsync_config.json
        force: yes

    - name: Start FDM with PM2
      shell: |
        if pm2 describe FDM > /dev/null 2>&1; then
          pm2 restart FDM --update-env
        else
          pm2 start index.js --name FDM
        fi
      args:
        chdir: flux-domain-manager
      environment:
        NODE_ENV: production
        NODE_CONFIG_DIR: /root/flux-domain-manager/config

    # Deleted and re-registered rather than restarted: pm2 restart re-runs the script
    # path it recorded when the process was first started, which for an already-deployed
    # CDM is index.js — now the routing entrypoint. Restarting it in place would put a
    # second router on this box, writing haproxy.cfg from its own view.
    - name: Start CDM with PM2 (primary only)
      shell: |
        pm2 delete CDM > /dev/null 2>&1 || true
        pm2 start cdm.js --name CDM
      args:
        chdir: cert-domain-manager
      environment:
        NODE_ENV: production
        NODE_CONFIG_DIR: /root/cert-domain-manager/config
      when: certRenewalPrimary | bool

    - name: Install get-cert CLI tool (primary only)
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          NODE_CONFIG_DIR=/root/cert-domain-manager/config node /root/cert-domain-manager/get-cert.js "$@"
        dest: /usr/local/bin/get-cert
        mode: '0755'
      when: certRenewalPrimary | bool

    - name: Stop CDM on non-primary hosts
      shell: pm2 describe CDM > /dev/null 2>&1 && pm2 delete CDM || true
      when: not certRenewalPrimary | bool
