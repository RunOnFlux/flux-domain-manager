# Before/after for the FluxOS domain-manager G selection pass.
#
#   docker compose -f poc/docker-compose.yml build
#   docker compose -f poc/docker-compose.yml up -d fleet
#   docker compose -f poc/docker-compose.yml run --rm bench-before
#   docker compose -f poc/docker-compose.yml run --rm bench-after
#
# BEFORE_ROOT must point at a checkout of the base commit. Create one with:
#   git worktree add /tmp/fdm-before <base-sha>
services:
  fleet:
    build:
      context: ..
      dockerfile: poc/Dockerfile
    environment:
      FLEET_NODES: "${FLEET_NODES:-2000}"
      FLEET_PORT_BASE: "20000"
    command: ["node", "poc/fleet.js"]

  bench-after:
    build:
      context: ..
      dockerfile: poc/Dockerfile
    depends_on: [fleet]
    command:
      - node
      - poc/bench.js
      - --impl-root=/app
      - --fleet-host=fleet
      - --apps=${APPS:-336}
      - --nodes=${FLEET_NODES:-2000}
      - --label=after

  bench-before:
    build:
      context: ..
      dockerfile: poc/Dockerfile
    depends_on: [fleet]
    volumes:
      - ${BEFORE_ROOT:-/tmp/fdm-before}:/before:ro
    command:
      - node
      - poc/bench.js
      - --impl-root=/before
      - --fleet-host=fleet
      - --apps=${APPS:-336}
      - --nodes=${FLEET_NODES:-2000}
      - --label=before
